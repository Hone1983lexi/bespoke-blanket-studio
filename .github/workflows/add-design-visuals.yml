name: Add design visuals
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch design dropdown
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker="/* DESIGN-VISUALS-V2 */"
          if marker not in s:
              css=r'''<style>
          /* DESIGN-VISUALS-V2 */
          .design-dropdown-grid a{display:grid!important;grid-template-columns:34px 1fr;align-items:center;gap:8px}
          .design-dropdown-grid a::before{content:"";width:34px;height:34px;border-radius:6px;border:1px solid #8f654f;display:block}
          .design-dropdown-grid a:nth-child(1)::before{background:linear-gradient(135deg,#e7d4bd,#b89b7c)}
          .design-dropdown-grid a:nth-child(2)::before{background:linear-gradient(135deg,#a94f35,#d28b3f,#e4c16b)}
          .design-dropdown-grid a:nth-child(3)::before{background:linear-gradient(180deg,#2e7fa3,#8bc5cf,#174f73)}
          .design-dropdown-grid a:nth-child(4)::before{background:linear-gradient(135deg,#f7c7d9,#c8dff0,#f4dfb6)}
          .design-dropdown-grid a:nth-child(5)::before{background:conic-gradient(#e85b5b,#f2b34b,#f4dc58,#70b86b,#62a8d5,#9a76bd,#e85b5b)}
          .design-dropdown-grid a:nth-child(6)::before{background:radial-gradient(circle,#f7d36b 0 18%,#6f88c7 19% 38%,#f0a55b 39% 55%,#5f806b 56%)}
          .design-dropdown-grid a:nth-child(7)::before{background:linear-gradient(135deg,#5d7654,#a67b57,#d1b98c)}
          .design-dropdown-grid a:nth-child(8)::before{background:radial-gradient(circle at 25% 30%,#d96c82 0 12%,transparent 13%),radial-gradient(circle at 70% 65%,#d7a23b 0 12%,transparent 13%),#a8bd83}
          .design-dropdown-grid a:nth-child(9)::before{background:repeating-linear-gradient(45deg,#6c5144 0 7px,#c9aa72 7px 14px,#7e8b69 14px 21px)}
          .design-dropdown-grid a:nth-child(10)::before{background:linear-gradient(90deg,#222,#777,#ddd,#444)}
          .design-dropdown-grid a:nth-child(11)::before{background:linear-gradient(45deg,#35465d 25%,#e5a15d 25% 50%,#7c9a91 50% 75%,#d7c8a6 75%)}
          .design-dropdown-grid a:nth-child(12)::before{background:linear-gradient(180deg,#d9c39c 0 45%,#a9c7c9 45% 70%,#5f8c9b 70%)}
          .design-dropdown-grid a:nth-child(13)::before{background:conic-gradient(#59645c 25%,#eee1c7 0 50%,#59645c 0 75%,#eee1c7 0);background-size:14px 14px}
          .design-dropdown-grid a:nth-child(14)::before{background:radial-gradient(circle at 30% 35%,#d96c82 0 12%,transparent 13%),radial-gradient(circle at 70% 60%,#d7a23b 0 12%,transparent 13%),#91a875}
          .design-dropdown-grid a:nth-child(15)::before{background:repeating-linear-gradient(0deg,#d97b68 0 6px,#e6c76b 6px 12px,#6f9a86 12px 18px,#8c78a9 18px 24px)}
          .design-dropdown-grid a:nth-child(16)::before{background:repeating-linear-gradient(45deg,#b89a7d 0 9px,#d9c7b2 9px 18px)}
          .design-dropdown-grid a:nth-child(17)::before{background:radial-gradient(circle at 20% 30%,#e58b9a 0 10%,transparent 11%),radial-gradient(circle at 70% 25%,#e9c45b 0 10%,transparent 11%),#a7b987}
          .design-dropdown-grid a:nth-child(18)::before{background:radial-gradient(circle at 35% 40%,#bd6674 0 17%,transparent 18%),radial-gradient(circle at 70% 70%,#d8a2a6 0 16%,transparent 17%),#ead9cc}
          .design-dropdown-grid a:nth-child(19)::before{background:linear-gradient(135deg,#536e58,#9aae78 45%,#d6c89b 46% 55%,#6b815d)}
          .design-dropdown-grid a:nth-child(20)::before{background:linear-gradient(135deg,#d9c3a5 0 35%,#91a678 35% 65%,#c97c72 65%)}
          .design-dropdown-grid a:nth-child(21)::before{background:linear-gradient(135deg,#a94f35 0 25%,#d28b3f 25% 50%,#6d7650 50% 75%,#7a4d3b 75%)}
          .design-dropdown-grid a:nth-child(22)::before{background:linear-gradient(135deg,#dfe8ef 0 25%,#a9c1d6 25% 50%,#f8f7f2 50% 75%,#6d8aa5 75%)}
          .design-dropdown-grid a:nth-child(23)::before{background:linear-gradient(135deg,#9cbd7b 0 25%,#e5c95d 25% 50%,#d98aa0 50% 75%,#8bb4a2 75%)}
          .design-dropdown-grid a:nth-child(24)::before{background:linear-gradient(135deg,#8d3f3f 0 25%,#d8c77b 25% 50%,#3f7655 50% 75%,#f2e8d1 75%)}
          @media(max-width:600px){.design-dropdown-grid a{grid-template-columns:38px 1fr}.design-dropdown-grid a::before{width:38px;height:38px}}
          </style>'''
              s=s.replace("</head>",css+"\n</head>",1)
              p.write_text(s,encoding="utf-8")
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/add-design-visuals.yml
          git commit -m "Add visual previews to design dropdown"
          git push
