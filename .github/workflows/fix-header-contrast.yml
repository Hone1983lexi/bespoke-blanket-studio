name: Fix header contrast

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix header contrast') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Darken header and dropdown
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          replacements={
            ".header{background:rgba(51,39,32,.97);border-bottom-color:#5b4438}":
            ".header{background:#4b3429!important;border-bottom-color:#76513f!important}",
            ".brand strong,.design-menu-trigger,.nav-simple{color:#f8eee7}":
            ".brand strong,.design-menu-trigger,.nav-simple{color:#fff4ec!important}",
            ".brand span{color:#d4b3a0}":
            ".brand span{color:#e0c1ad!important}",
            ".design-menu-trigger span{color:#d3aa91}":
            ".design-menu-trigger span{color:#e0c1ad!important}",
            ".design-dropdown{background:#ead3c2;border-color:#b98f77;box-shadow:0 18px 42px rgba(35,24,18,.32)}":
            ".design-dropdown{background:#4b3429!important;border-color:#8f654f!important;box-shadow:0 18px 42px rgba(35,24,18,.45)!important}",
            ".design-dropdown-section-title{margin:14px 0 7px;padding-top:10px;border-top:1px solid #c9a991;color:#76513f;font-family:Georgia,serif;font-size:15px}":
            ".design-dropdown-section-title{margin:14px 0 7px;padding-top:10px;border-top:1px solid #76513f;color:#e0c1ad;font-family:Georgia,serif;font-size:15px}",
            ".design-dropdown-grid a{background:#dfc1ad;color:#4f382d}":
            ".design-dropdown-grid a{background:#604638!important;color:#fff1e8!important}",
            ".design-dropdown-grid a:hover{background:#c99f84;color:#3f2d24}":
            ".design-dropdown-grid a:hover{background:#8f654f!important;color:#fffaf6!important}",
            ".design-dropdown-custom{border-top-color:#c9a991}":
            ".design-dropdown-custom{border-top-color:#76513f!important;color:#e7c5b0!important}"
          }
          missing=[k for k in replacements if k not in s]
          if missing:
            raise SystemExit("Expected CSS not found: "+str(missing))
          for a,b in replacements.items():
            s=s.replace(a,b,1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "Hone1983lexi"
          git config user.email "honedanny25@hotmail.com"
          git add index.html
          git commit -m "Fix header contrast"
          git push
