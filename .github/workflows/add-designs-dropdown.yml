name: Add designs dropdown

on:
  push:
    paths:
      - .design-dropdown-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          old_nav = re.search(r'<div class="navlinks">.*?</div>\s*<a class="btn" href="#bespoke">Enquire Now</a>', s, re.S)
          if not old_nav:
              raise SystemExit("Navigation block not found")

          new_nav = '''<div class="design-menu">
              <button type="button" class="design-menu-trigger">Designs <span>⌄</span></button>
              <div class="design-dropdown">
                <div class="design-dropdown-title">Choose a style</div>
                <div class="design-dropdown-grid">
                  <a href="#bespoke" data-design="Natural Calm">Natural Calm</a>
                  <a href="#bespoke" data-design="Sunset Blocks">Sunset Blocks</a>
                  <a href="#bespoke" data-design="Ocean Blue">Ocean Blue</a>
                  <a href="#bespoke" data-design="Soft Pastels">Soft Pastels</a>
                  <a href="#bespoke" data-design="Rainbow Granny">Rainbow Granny</a>
                  <a href="#bespoke" data-design="Star Blanket">Star Blanket</a>
                  <a href="#bespoke" data-design="Woodland</a>
                  <a href="#bespoke" data-design="Wildflower</a>
                  <a href="#bespoke" data-design="Heritage</a>
                  <a href="#bespoke" data-design="Monochrome</a>
                  <a href="#bespoke" data-design="Modern Geometric</a>
                  <a href="#bespoke" data-design="Coastal Sand</a>
                  <a href="#bespoke" data-design="Checkerboard</a>
                  <a href="#bespoke" data-design="Floral Garden</a>
                  <a href="#bespoke" data-design="Granny Stripe</a>
                  <a href="#bespoke" data-design="Chunky Texture</a>
                </div>
                <a class="design-dropdown-custom" href="#bespoke" data-design="Custom design">Don't see your style? Create something completely custom →</a>
              </div>
            </div>
            <a class="nav-simple" href="#baby">Baby</a>
            <a class="nav-simple" href="#process">How It Works</a>
            <a class="nav-simple" href="#about">About</a>
            <a class="btn" href="#bespoke">Enquire Now</a>'''

          # Fix quote marks in the newly added labels.
          new_nav = new_nav.replace('data-design="Woodland</a>', 'data-design="Woodland">Woodland</a>')
          new_nav = new_nav.replace('data-design="Wildflower</a>', 'data-design="Wildflower">Wildflower</a>')
          new_nav = new_nav.replace('data-design="Heritage</a>', 'data-design="Heritage">Heritage</a>')
          new_nav = new_nav.replace('data-design="Monochrome</a>', 'data-design="Monochrome">Monochrome</a>')
          new_nav = new_nav.replace('data-design="Modern Geometric</a>', 'data-design="Modern Geometric">Modern Geometric</a>')
          new_nav = new_nav.replace('data-design="Coastal Sand</a>', 'data-design="Coastal Sand">Coastal Sand</a>')
          new_nav = new_nav.replace('data-design="Checkerboard</a>', 'data-design="Checkerboard">Checkerboard</a>')
          new_nav = new_nav.replace('data-design="Floral Garden</a>', 'data-design="Floral Garden">Floral Garden</a>')
          new_nav = new_nav.replace('data-design="Granny Stripe</a>', 'data-design="Granny Stripe">Granny Stripe</a>')
          new_nav = new_nav.replace('data-design="Chunky Texture</a>', 'data-design="Chunky Texture">Chunky Texture</a>')

          s = s[:old_nav.start()] + new_nav + s[old_nav.end():]

          css = r'''
          <style id="design-dropdown-styles">
          .design-menu{position:relative}
          .design-menu-trigger{border:0;background:none;color:var(--ink);font:inherit;font-size:14px;cursor:pointer;padding:6px 0}
          .design-menu-trigger span{font-size:12px;margin-left:3px}
          .design-dropdown{position:absolute;top:calc(100% + 12px);right:-80px;width:430px;background:#ead3c2;border:1px solid #c9a991;border-radius:8px;box-shadow:0 16px 38px rgba(50,38,30,.18);padding:18px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:.18s ease;z-index:30}
          .design-menu:hover .design-dropdown,.design-menu:focus-within .design-dropdown{opacity:1;visibility:visible;transform:translateY(0)}
          .design-dropdown-title{font-family:Georgia,serif;font-size:20px;color:#4b3429;margin-bottom:12px}
          .design-dropdown-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px}
          .design-dropdown-grid a{display:block;padding:9px 10px;border-radius:5px;text-decoration:none;color:#5a4438;font-size:13px}
          .design-dropdown-grid a:hover{background:#d7b69f;color:#3f2d24}
          .design-dropdown-custom{display:block;margin-top:12px;padding-top:12px;border-top:1px solid #c9a991;color:#8f573e!important;font-size:13px;font-weight:600;text-decoration:none}
          .nav-simple{font-size:14px;text-decoration:none}
          .nav-simple:hover{color:var(--accent-dark)}
          .design-dropdown-link-selected{background:#d7b69f}
          #examples{display:none!important}
          @media(max-width:900px){
            .nav{gap:16px}
            .nav-simple{display:none}
            .design-dropdown{right:-35px}
          }
          @media(max-width:600px){
            .design-menu{display:block;flex:0 0 auto}
            .design-menu-trigger{font-size:12px;padding:8px 4px}
            .design-dropdown{position:fixed;top:78px;left:10px;right:10px;width:auto;max-height:70vh;overflow:auto;padding:15px}
            .design-dropdown-grid{grid-template-columns:1fr 1fr}
            .design-dropdown-grid a{font-size:13px;padding:10px 8px}
            .nav > .btn{padding:10px 11px!important;font-size:11px!important}
          }
          </style>
          '''
          s = s.replace("</head>", css + "\n</head>", 1)

          js = r'''
          <script>
          document.addEventListener('DOMContentLoaded', function(){
            document.querySelectorAll('.design-dropdown [data-design]').forEach(function(link){
              link.addEventListener('click', function(){
                var design = this.getAttribute('data-design');
                var choices = document.querySelectorAll('.design-choice[data-choice]');
                var matched = false;
                choices.forEach(function(choice){
                  if(choice.getAttribute('data-choice') === 'Design: ' + design){
                    choice.click();
                    matched = true;
                  }
                });
                if(!matched){
                  var summary = document.getElementById('quoteChoices');
                  if(summary){
                    var current = summary.textContent.replace(/^Nothing selected yet — choose as much or as little as you know.$/,'').trim();
                    var lines = current ? current.split(' · ').filter(function(x){return x.indexOf('Design:') !== 0;}) : [];
                    lines.unshift('Design: ' + design);
                    summary.textContent = lines.join(' · ');
                  }
                }
                var target = document.getElementById('bespoke');
                if(target) setTimeout(function(){target.scrollIntoView({behavior:'smooth',block:'start'});},50);
              });
            });
          });
          </script>
          '''
          s = s.replace("</body>", js + "\n</body>", 1)

          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add designs dropdown and simplify homepage"
          git push
