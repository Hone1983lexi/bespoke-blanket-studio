name: Mobile header patch 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          extra='''<style>
          @media (max-width: 600px) {
            .nav { padding: 9px 14px !important; min-height: 78px !important; gap: 10px !important; }
            .brand strong { font-size: 18px !important; line-height: 1.08 !important; letter-spacing: .045em !important; }
            .brand span { font-size: 8px !important; letter-spacing: .08em !important; margin-top: 3px !important; }
            .nav > .btn { padding: 10px 13px !important; font-size: 12px !important; line-height: 1.1 !important; min-height: 48px !important; border-radius: 5px !important; }
          }
          </style>'''
          if "min-height: 78px !important" not in s:
              s=s.replace("</head>", extra+"</head>",1)
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply smaller mobile header"
          git push