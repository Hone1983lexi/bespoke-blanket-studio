name: Fix design image matching

on:
  push:
    paths:
      - .design-image-fix-trigger

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match design images to descriptions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("index.html")
          s = path.read_text(encoding="utf-8")

          desired = {
              "Natural Calm": "Sunset Blocks",
              "Sunset Blocks": "Ocean Blue",
              "Ocean Blue": "Soft Pastels",
              "Soft Pastels": "Star Blanket",
              "Rainbow Granny": "Natural Calm",
              "Star Blanket": "Rainbow Granny",
          }

          cards = re.findall(r'<article class="example-card">.*?</article>', s, flags=re.S)
          if len(cards) < 6:
              raise SystemExit(f"Expected at least 6 inspiration cards, found {len(cards)}")

          src_by_label = {}
          for card in cards[:6]:
              lm = re.search(r'<h3>([^<]+)</h3>', card)
              sm = re.search(r'src="(data:image/jpeg;base64,[^"]+)"', card)
              if lm and sm and lm.group(1) in desired:
                  src_by_label[lm.group(1)] = sm.group(1)

          if set(desired) - set(src_by_label):
              raise SystemExit("Could not build the six current image mappings")

          alt_patterns = {
              "Natural Calm": r'Natural Calm crochet blanket(?: example)?',
              "Sunset Blocks": r'Sunset Blocks crochet blanket(?: example)?',
              "Ocean Blue": r'Ocean Blue crochet blanket(?: example)?',
              "Soft Pastels": r'Soft Pastels crochet blanket(?: example)?',
              "Rainbow Granny": r'Rainbow Granny crochet blanket(?: example)?',
              "Star Blanket": r'Star(?: Blanket)? crochet blanket(?: example)?',
          }

          for label, source_label in desired.items():
              new_src = src_by_label[source_label]
              pattern = re.compile(
                  r'(<img\b[^>]*\bsrc=")data:image/jpeg;base64,[^"]+("([^>]*\balt=")'
                  + alt_patterns[label]
                  + r'")',
                  flags=re.S
              )
              s, n = pattern.subn(r'\1' + new_src + r'\2', s)
              if n == 0:
                  raise SystemExit(f"No images found for {label}")

          path.write_text(s, encoding="utf-8")
          PY
      - name: Commit image changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Match design images to descriptions"
          git push
