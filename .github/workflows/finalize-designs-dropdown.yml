name: Finalize designs dropdown

on:
  push:
    paths:
      - .design-dropdown-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("#examples{display:none!important}", "#examples,#designs{display:none!important}")
          s=s.replace('<a class="btn secondary" href="#designs">Explore Designs</a>', '<a class="btn secondary" href="#bespoke">Choose Your Design</a>')
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Hide design sections from homepage"
          git push
